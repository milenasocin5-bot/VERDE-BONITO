<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto - VERDE BONITO</title>

    <!-- seo -->
    <meta name="description"
        content="Contactate con Verde Bonito para consulta sobre productos naturales, pedidos o asesoramiento en alimentacion saludable">

    <!-- link de bootsrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- css-->
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>
    <!-- header - menu -->
    <header>
        <nav class="navbar navbar-expand-lg navbar-dark bg-success">
            <div class="container">
                <!-- logo-->

                <a class="navbar-brand" href="../index.html">
                    <img src="../img/logo.png" alt="Logo Verde Bonito productos naturales" width="100">
                </a>

                <!-- boton menu responsive-->
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navContacto"
                    aria-controls="navContacto" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navContacto">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item"><a class="nav-link" href="../index.html">Inicio</a></li>
                        <li class="nav-item"><a class="nav-link" href="productos.html">Productos</a></li>
                        <li class="nav-item"><a class="nav-link active" href="contacto.html">Contacto</a></li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>
    <!-- contenido principal -->
    <main class="container py-5">

        <!-- titulo -->
        <h1 class="text-center mb-4">Contacto </h1>

        <!-- formulario de contacto -->
        <form class="contacto-form mx-auto">
            <!-- campo nombre-->
            <div class="mb-3">
                <label for="nombre" class="form-label">Nombre</label>
                <input type="text" id="nombre" class="form-control" placeholder="Tu nombre">
            </div>
            <!-- campo email -->
            <div class="mb-3">
                <label for="email" class="form-label">Correo Electrónico</label>
                <input type="email" id="email" class="form-control" placeholder="ejemplo@mail.com">
            </div>
            <!-- campo mensaje-->
            <div class="mb-3">
                <label for="mensaje" class="form-label">Mensaje</label>
                <textarea id="mensaje" class="form-control" rows="5" placeholder="Escribe tu mensaje"></textarea>
            </div>

            <!-- boton enviar -->
            <button type="submit" class="btn btn-primary">Enviar</button>
        </form>
    </main>
    <!-- footer-->
    <footer class="bg-dark text-white py-4">
        <div class="container text-center">
            <p>&copy; 2026 VERDE BONITO</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
